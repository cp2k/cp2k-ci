    <circle cx="5.4"  cy="25.6" r="3.3" fill="#dfe7f5"/>
    <circle cx="26.6" cy="25.6" r="3.3" fill="#34d399"/>
    <circle cx="16"   cy="15.6" r="4.3" fill="url(#atomO)"/>
