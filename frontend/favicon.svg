<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CP2K CI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="atomO" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffbf73"/>
